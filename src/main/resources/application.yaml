spring:
    application:
        name: BookStore_Web_Application
server:
    port: 3636
    servlet:
        context-path: /api

springdoc:
    swagger-ui:
        path: /swagger-ui.html
        operationsSorter: alpha

mybatis:
    mapper-locations: classpath:mappers/*.xml
logging:
    level:
        org.springframework.security: INFO
        org:
            mybatis: WARN
        org.springframework.kafka: INFO
#
cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

stripe:
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    api-version: 2025-09-30.clover
    # VND is a zero-decimal currency; use e.g. usd if your Stripe account cannot charge VND
    currency: ${STRIPE_CURRENCY:vnd}
    # Empty = the payment methods enabled in the Stripe Dashboard. Or list some, e.g. card,us_bank_account
    payment-method-types: ${STRIPE_PAYMENT_METHOD_TYPES:}
    session-expiry-minutes: 60
